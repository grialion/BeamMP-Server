name: Build and Push Docker image

on:
  push:
    branches: [minor, ci-arch-build-test]
  release:
    types: [published]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/beammp-server

jobs:
  build-and-push:
    #runs-on: debian-12
    runs-on: [self-hosted, x64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Set up slim image
        uses: kitabisa/docker-slim-action@v1
        env:
          DSLIM_HTTP_PROBE: false
        with:
          target: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          tag: ${{ github.sha }}-slim
      - name: Push slim image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }}-slim ${{ env.IMAGE_NAME }}:latest-slim 
          docker push ${{ env.IMAGE_NAME }} --all-tags
